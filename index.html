          <div class="svg-placeholder" style="display:none;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#233D32" stroke-width="1.6">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </svg>
            <span style="margin-top:4px; font-family:'DFKai-SB',serif;">【${h.name}本草錄】</span>
          </div>
          <span class="badge">${h.category}</span>
        </div>
        <div class="card-body">
          <div class="card-title">${h.name}</div>
          <div class="card-sci">${h.scientificName}</div>
          <div class="card-nature">${h.nature}</div>
          <div class="card-desc">${h.summary}</div>
          <div class="card-footer">查閱本草詳情與配伍關聯 →</div>
        </div>
      </div>
    `).join("");
  }

  function openDetail(id) {
    const herb = herbsData.find(h => h.id === id);
    if (!herb) return;

    const relatedButtons = herb.related.map(relId => {
      const target = herbsData.find(x => x.id === relId);
      return target ? `<button class="cross-link-btn" onclick="openDetail('${target.id}')">🌿 ${target.name}（${target.category}）</button>` : "";
    }).join("");

    document.getElementById("detailContent").innerHTML = `
      <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
      <span style="background:#A8382B; color:#FDF8F2; padding:0.2rem 0.65rem; border-radius:3px; font-size:0.78rem; letter-spacing:1px;">${herb.category}</span>
      <h2 style="margin-top:0.55rem;">${herb.name} <small style="font-size:0.9rem; color:#635B52; font-family:sans-serif;">(${herb.alias})</small></h2>
      <div class="sci">${herb.scientificName}</div>
      <div class="detail-row"><span class="detail-label">【傳統性味歸經】</span>${herb.nature}</div>
      <div class="detail-row"><span class="detail-label">【傳統用途與應用】</span>${herb.effects}</div>
      <div class="detail-row"><span class="detail-label">【使用禁忌與風險提示】</span>${herb.precautions}</div>
      <div class="detail-row">
        <span class="detail-label">【關聯本草索引】</span>
        <div class="cross-links">${relatedButtons}</div>
      </div>
      <div class="safety-box">
        <strong>共通安全備註：</strong>本資料不提供劑量、處方或疾病治療方案。植物正確鑑定、炮製方式與個人體質皆會改變風險，使用前請先向醫療專業人員確認。
      </div>
      <div style="margin-top:1rem; padding-top:0.75rem; border-top:1px dashed #C9BFA9; font-size:0.8rem; color:#635B52; font-family:sans-serif;">
        條目檔案：<code>wiki/${herb.id}.md</code> ｜ 文獻出處：<code>${herb.source}</code>
      </div>
    `;
    document.getElementById("detailModal").classList.add("open");
  }

  function openLogModal() {
    document.getElementById("logList").innerHTML = logData.map(item => `
      <div class="log-entry">
        <div style="font-weight:bold; color:#233D32;">[${item.date}] ${item.type.toUpperCase()} ｜ ${item.title}</div>
        <div style="font-size:0.9rem; margin-top:0.3rem;">${item.detail}</div>
      </div>
    `).join("");
    document.getElementById("logModal").classList.add("open");
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove("open");
  }

  init();
</script>
</body>
</html>
